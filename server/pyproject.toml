[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ultron-server"
version = "0.1.0"
description = "ULTRON - local-first, agentic AI operating environment (server side)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ULTRON" }]
keywords = ["agent", "ai", "orchestration", "automation", "ollama", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Core runtime. Everything the server needs to boot and serve /health.
# Deliberately boring, no framework-level magic (spec section 39, 57).
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pgvector>=0.3.6",
    "greenlet>=3.1",
    "redis>=5.2",
    "httpx>=0.28",
    "websockets>=13.1",
    "PyJWT>=2.10",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.21",
    "apscheduler>=3.10,<4.0",
    "psutil>=6.1",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# Provider SDKs are optional: no API keys required for local development
# (spec section 3). Adapters use httpx directly and load these lazily.
providers = [
    "openai>=1.54",
    "google-genai>=0.3",
    "anthropic>=0.40",
]
# Playwright browser automation (spec section 11).
browser = [
    "playwright>=1.49",
]
# Local voice stack (spec section 25).
voice = [
    "faster-whisper>=1.1",
]
# Optional MQTT device transport (spec section 26).
iot = [
    "paho-mqtt>=2.1",
]
# Prometheus/Grafana are optional but prometheus-client is already core.
monitoring = [
    "prometheus-client>=0.21",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-psutil>=7.0",
    # fakeredis runs Lua only when lupa is present. The `lua` extra is required,
    # not optional: the distributed lock releases via a compare-and-delete
    # script, and without it that safety-critical path is the one thing in
    # redis_client.py the unit suite cannot exercise.
    "fakeredis[lua]>=2.26",
    # In-memory SQLite, so session and transaction semantics can be tested on a
    # bare checkout with no PostgreSQL. Never used in production: PostgreSQL is
    # the authoritative store.
    "aiosqlite>=0.20",
]

[project.scripts]
ultron = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.sources]
"app" = "app"

# --------------------------------------------------------------------------
# Ruff - lint + format
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
extend-exclude = ["migrations/versions", ".venv"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "ASYNC", # flake8-async
    "RUF", # ruff specific
    "DTZ", # naive datetimes
    "ANN", # type annotations
    "PTH", # pathlib usage (spec section 36: no Windows-only paths)
    "S",   # flake8-bandit (spec section 31: security defaults must fail closed)
]
ignore = [
    "ANN401",  # Any is allowed at provider/protocol boundaries
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF001",  # ambiguous unicode: appears in user-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) and the hardcoded-secret rules are disabled in tests because the
# secret fixtures there exist precisely to prove that redaction works. A test
# that has to embed "hunter2" to assert it never reaches a log is not a finding.
"tests/**" = ["ANN", "S101", "S104", "S105", "S106", "S107", "PLR2004", "ARG001"]
"app/api/**" = ["B008"]
"app/database/models/**" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# --------------------------------------------------------------------------
# Mypy - type checking
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
# Tests live in a flat namespace with a conftest.py at two levels (root and
# per-directory). Without these, mypy names both of them `conftest` and aborts
# on the clash before checking anything; explicit bases make each file's module
# name follow its path (`tests.conftest`, `tests.unit.conftest`) instead.
explicit_package_bases = true
mypy_path = ["."]
# Overrides below are declared up front for optional dependencies that may not
# be installed yet; an unused override is not a defect worth reporting.
warn_unused_configs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/versions/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.*",
    "asyncpg.*",
    "fakeredis.*",
    "faster_whisper.*",
    "faster_whisper.tokenizer.*",
    "google.*",
    "openai.*",
    "anthropic.*",
    "paho.*",
    "pgvector.*",
    "playwright.*",
    "pydantic_settings.*",
    "respx.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["tests.*", "conftest.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

# --------------------------------------------------------------------------
# Pytest
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
]
markers = [
    "unit: fast, no external services",
    "integration: needs PostgreSQL and/or Redis",
    "e2e: full stack through Core",
    "requires_docker: needs a running Docker daemon",
    "requires_ollama: needs a reachable Ollama server",
    "requires_playwright: needs installed Playwright browsers",
    "requires_opencode: needs the OpenCode CLI on PATH",
    "slow: longer running test",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::DeprecationWarning:apscheduler.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20261006",
]
