# ---------------------------------------------------------------------------
# ULTRON - Alembic configuration
#
# The database URL is deliberately NOT set here. `migrations/env.py` takes it
# from `app.config.get_settings().database.url` so there is exactly one place a
# DSN is configured, and so no password is ever written into a tracked file.
# `sqlalchemy.url` is left empty; env.py overwrites it before use.
# ---------------------------------------------------------------------------

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# Timestamped, sortable revision filenames. `rev_id` is generated from a uuid4
# hex prefix by Alembic's own default; the timestamp prefix makes `ls versions`
# read in the order they were written, which matters once there are more than a
# handful.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
# Generated against the models as they are. Set to `compare_type` awareness in
# env.py, which is what actually matters.
revision_environment = false

# --- Logging -----------------------------------------------------------------
# Alembic's own loggers are silenced by default in env.py; this section exists
# so `-x log_level=DEBUG` or a deliberate override has somewhere to go.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
