<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTRON</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #171e26;
    --line: #26313c;
    --text: #e6edf3;
    --muted: #8b98a5;
    --accent: #4f8cff;
    --accent-dark: #3b6fd4;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { max-width: 820px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; padding: 16px 16px 0; }

  /* Login */
  #login { margin: auto 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 32px; }
  #login h1 { margin: 0 0 4px; font-size: 22px; }
  #login p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  #login input {
    width: 100%; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 15px;
  }
  #login button {
    width: 100%; padding: 11px; border: 0; border-radius: 8px; background: var(--accent);
    color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  #login button:hover { background: var(--accent-dark); }
  #login .error { color: #ff6b6b; font-size: 13px; margin-bottom: 12px; min-height: 16px; }

  /* Chat */
  #chat { display: none; flex: 1; flex-direction: column; min-height: 0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 14px; }
  header .brand { font-weight: 700; font-size: 17px; letter-spacing: 0.3px; }
  header .sub { color: var(--muted); font-size: 12px; margin-left: 10px; }
  header button {
    border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  header button:hover { color: var(--text); }

  #log { flex: 1; overflow-y: auto; padding-right: 6px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 86%; padding: 10px 14px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .typing { color: var(--muted); font-size: 14px; align-self: flex-start; padding: 10px 14px; }

  form { display: flex; gap: 10px; padding: 14px 0 18px; }
  textarea {
    flex: 1; resize: none; padding: 11px 13px; border-radius: 10px; min-height: 48px; max-height: 160px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 15px; font-family: inherit;
  }
  textarea:focus, input:focus { outline: 2px solid var(--accent); }
  #send {
    border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer;
    font-size: 15px; font-weight: 600; padding: 0 22px;
  }
  #send:hover { background: var(--accent-dark); }
  #send:disabled, textarea:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
<div id="app">
  <section id="login">
    <h1>ULTRON</h1>
    <p>Sign in to ask anything.</p>
    <div class="error" id="loginError"></div>
    <input id="username" type="text" autocomplete="username" placeholder="Username" value="admin">
    <input id="password" type="password" autocomplete="current-password" placeholder="Password">
    <button id="loginBtn">Sign in</button>
  </section>

  <section id="chat">
    <header>
      <div>
        <span class="brand">ULTRON</span>
        <span class="sub" id="account"></span>
      </div>
      <button id="logoutBtn">Sign out</button>
    </header>
    <div id="log"></div>
    <form id="composer">
      <textarea id="input" rows="1" placeholder="Ask anything…"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </section>
</div>

<script>
(function () {
  var TOKEN_KEY = "ultron.token";
  var API = "";

  var el = {};
  ["login", "loginError", "username", "password", "loginBtn", "chat",
   "account", "log", "composer", "input", "send", "logoutBtn"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });

  var token = localStorage.getItem(TOKEN_KEY);

  function view() {
    el[token ? "chat" : "login"].style.display = token ? "flex" : "block";
    el[token ? "login" : "chat"].style.display = token ? "none" : "none";
  }

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers || {});
    if (token) opts.headers["Authorization"] = "Bearer " + token;
    return fetch(API + path, opts).then(function (res) {
      if (res.status === 401 && token) { token = null; localStorage.removeItem(TOKEN_KEY); view(); }
      return res.json().catch(function () { return {}; }).then(function (body) {
        if (!res.ok) throw new Error(body && body.error && body.error.message ? body.error.message : ("HTTP " + res.status));
        return body;
      });
    });
  }

  function logUser(text) { append("user", text, null); }
  function append(kind, text, meta) {
    var div = document.createElement("div");
    div.className = "msg " + kind;
    div.textContent = text;
    if (meta) {
      var m = document.createElement("div");
      m.className = "meta";
      m.textContent = meta;
      div.appendChild(m);
    }
    el.log.appendChild(div);
    el.log.scrollTop = el.log.scrollHeight;
  }

  function login() {
    var user = el.username.value.trim();
    var pass = el.password.value;
    el.loginError.textContent = "";
    fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: user, password: pass }),
    }).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) throw new Error(body.error ? body.error.message : "Login failed");
        return body;
      });
    }).then(function (body) {
      token = body.access_token;
      localStorage.setItem(TOKEN_KEY, token);
      view();
      whoami();
    }).catch(function (err) {
      el.loginError.textContent = err.message;
    });
  }

  function whoami() {
    api("/auth/whoami").then(function (me) {
      el.account.textContent = me.username || me.actor_type;
    }).catch(function () { el.account.textContent = ""; });
  }

  function send(e) {
    e.preventDefault();
    var text = el.input.value.trim();
    if (!text) return;
    el.input.value = "";
    logUser(text);
    el.log.appendChild(typing());
    el.log.scrollTop = el.log.scrollHeight;
    setBusy(true);
    api("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text }),
    }).then(function (body) {
      removeTyping();
      var meta = body.model + " · " + (body.tool_calls || 0) + " tool call" +
        (body.tool_calls === 1 ? "" : "s") + " · " + body.took_ms + " ms";
      append("bot", body.answer || "(no answer)", meta);
    }).catch(function (err) {
      removeTyping();
      append("bot", "Error: " + err.message, null);
    }).finally(function () { setBusy(false); });
  }

  function typing() {
    var div = document.createElement("div");
    div.className = "typing";
    div.id = "typing";
    div.textContent = "thinking…";
    return div;
  }
  function removeTyping() {
    var t = document.getElementById("typing");
    if (t) t.remove();
  }
  function setBusy(b) {
    el.send.disabled = b;
    el.input.disabled = b;
    el.input.focus();
  }

  el.loginBtn.addEventListener("click", login);
  el.password.addEventListener("keydown", function (ev) { if (ev.key === "Enter") login(); });
  el.composer.addEventListener("submit", send);
  el.logoutBtn.addEventListener("click", function () {
    token = null;
    localStorage.removeItem(TOKEN_KEY);
    view();
  });
  el.input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(ev); }
  });

  if (token) { view(); whoami(); } else { view(); }
})();
</script>
</body>
</html>
