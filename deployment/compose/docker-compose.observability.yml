# Optional observability profile for ULTRON (T184, spec §32).
#
# This file is the `observability` compose profile: Prometheus scrapes the
# ULTRON API's /metrics and Grafana renders the shipped dashboard. It is
# OPTIONAL and additive -- the documented deployment path is non-Docker
# systemd (T194), and this exists so an operator who already runs ULTRON under
# compose can add metrics without a second design.
#
# It deliberately defines only Prometheus and Grafana. The ULTRON API itself is
# expected to be reachable as `ultron-api:8000` on the same compose network; if
# the API runs under systemd instead, point prometheus.yml at the host address
# and drop this file's services behind a network that can reach it.
#
# Nothing here is exposed publicly: both ports bind to 127.0.0.1 so the stack is
# reachable only through an SSH tunnel or the reverse proxy, matching §32's
# "restrict /metrics at the network layer".
name: ultron-observability

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - ultron

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ultron

volumes:
  prometheus-data:
  grafana-data:

networks:
  ultron:
    name: ultron
    external: true
